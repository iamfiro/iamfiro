name: README Sync

on:
  push:
    paths:
      - 'main.mustache'
      - 'index.js'
      - '.github/workflows/main.yml'
  schedule:
    # 매일 00:00 KST (= 15:00 UTC 전일). GitHub Actions cron은 UTC 기준으로 동작한다.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync projects / awards / blog from API
        run: node index.js
        env:
          API_BASE_URL: https://api.devfiro.com

      - name: Commit & push README.md
        run: |
          if git diff --quiet -- README.md; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync projects/awards/blog from api.devfiro.com"
          git push
